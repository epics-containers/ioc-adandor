# yaml-language-server: $schema=https://github.com/epics-containers/ioc-adandor/releases/latest/download/ibek.ioc.schema.json

# Converted from the builder XML /dls_sw/work/R3.14.12.7/support/BL21I-BUILDER/etc/makeIocs/BL21I-EA-IOC-01.xml
# with builder2ibek bb7ba9e xml2yaml.
# Changed, so that nobody running this test reaches a real device:
# - 0 device addresses replaced with 127.0.0.1: the XML has none, and no secrets
# - detectorPlugins.gdaPlugins, an ibek-runtime-support pattern this image does
#   not hold, replaced by the ADCore and ffmpegServer plugins it creates; left
#   out are its gdaPlugins.template records, its post-init dbpf settings and
#   its NDStats attributes file
# tests/run-tests.sh runs it with start.sh --test, which generates the
# runtime assets but does not launch the IOC.

ioc_name: "{{ _global.get_env('IOC_NAME') }}"

description: auto-generated by https://github.com/epics-containers/builder2ibek

entities:

  - type: epics.EpicsEnvSet
    name: EPICS_TZ
    value: GMT0BST

  - type: epics.EpicsEnvSet
    name: STREAM_PROTOCOL_PATH
    value: /epics/runtime/protocol/

  - type: devIocStats.iocAdminSoft
    IOC: '{{ ioc_name | upper }}'

  - type: epics.EpicsCaMaxArrayBytes
    max_bytes: 17500000

  - type: autosave.Autosave
    P: 'BL21I-EA-IOC-01:'

  - type: pvlogging.PvLogging
    access_file: /epics/support/pvlogging/src/access.acf

  - type: ADAndor.andorCCD
    MEMORY: -1
    P: BL21I-EA-DET-01
    PORT: ANDOR.cam
    R: ':CAM:'
    TIMEOUT: 1

  - type: ADCore.NDTransform
    ENABLED: 1
    NDARRAY_PORT: ANDOR.cam
    P: BL21I-EA-DET-01
    PORT: ANDOR.trf
    R: ':TRF:'


  - type: ADCore.NDROI
    ENABLED: 1
    MAX_THREADS: 16
    NDARRAY_PORT: ANDOR.cam
    P: BL21I-EA-DET-01
    PORT: ANDOR.roi
    QUEUE: 1000
    R: ':ROI:'

  - type: ADCore.NDROI
    MAX_THREADS: 16
    NDARRAY_PORT: ANDOR.cam
    P: BL21I-EA-DET-01
    PORT: ANDOR.rois.roi1
    QUEUE: 1000
    R: ':ROI1:'

  - type: ADCore.NDROI
    MAX_THREADS: 16
    NDARRAY_PORT: ANDOR.cam
    P: BL21I-EA-DET-01
    PORT: ANDOR.rois.roi2
    QUEUE: 1000
    R: ':ROI2:'

  - type: ADCore.NDROI
    MAX_THREADS: 16
    NDARRAY_PORT: ANDOR.cam
    P: BL21I-EA-DET-01
    PORT: ANDOR.rois.roi3
    QUEUE: 1000
    R: ':ROI3:'

  - type: ADCore.NDROI
    MAX_THREADS: 16
    NDARRAY_PORT: ANDOR.cam
    P: BL21I-EA-DET-01
    PORT: ANDOR.rois.roi4
    QUEUE: 1000
    R: ':ROI4:'

  - type: ADCore.NDROI
    MAX_THREADS: 16
    NDARRAY_PORT: ANDOR.cam
    P: BL21I-EA-DET-01
    PORT: ANDOR.rois.roi5
    QUEUE: 1000
    R: ':ROI5:'

  - type: ADCore.NDROI
    MAX_THREADS: 16
    NDARRAY_PORT: ANDOR.cam
    P: BL21I-EA-DET-01
    PORT: ANDOR.rois.roi6
    QUEUE: 1000
    R: ':ROI6:'

  - type: ADCore.NDStats
    ENABLED: 1
    HIST_SIZE: 256
    MAX_THREADS: 16
    NCHANS: 10000
    NDARRAY_PORT: ANDOR.cam
    P: BL21I-EA-DET-01
    PORT: ANDOR.stat
    QUEUE: 1000
    R: ':STAT:'
    XSIZE: 2048
    YSIZE: 2048

  - type: ADCore.NDStats
    HIST_SIZE: 256
    MAX_THREADS: 16
    NCHANS: 10000
    NDARRAY_PORT: ANDOR.rois.roi1
    P: BL21I-EA-DET-01
    PORT: ANDOR.stats.stat1
    QUEUE: 1000
    R: ':STAT1:'
    XSIZE: 2048
    YSIZE: 2048

  - type: ADCore.NDStats
    HIST_SIZE: 256
    MAX_THREADS: 16
    NCHANS: 10000
    NDARRAY_PORT: ANDOR.rois.roi2
    P: BL21I-EA-DET-01
    PORT: ANDOR.stats.stat2
    QUEUE: 1000
    R: ':STAT2:'
    XSIZE: 2048
    YSIZE: 2048

  - type: ADCore.NDStats
    HIST_SIZE: 256
    MAX_THREADS: 16
    NCHANS: 10000
    NDARRAY_PORT: ANDOR.rois.roi3
    P: BL21I-EA-DET-01
    PORT: ANDOR.stats.stat3
    QUEUE: 1000
    R: ':STAT3:'
    XSIZE: 2048
    YSIZE: 2048

  - type: ADCore.NDStats
    HIST_SIZE: 256
    MAX_THREADS: 16
    NCHANS: 10000
    NDARRAY_PORT: ANDOR.rois.roi4
    P: BL21I-EA-DET-01
    PORT: ANDOR.stats.stat4
    QUEUE: 1000
    R: ':STAT4:'
    XSIZE: 2048
    YSIZE: 2048

  - type: ADCore.NDStats
    HIST_SIZE: 256
    MAX_THREADS: 16
    NCHANS: 10000
    NDARRAY_PORT: ANDOR.rois.roi5
    P: BL21I-EA-DET-01
    PORT: ANDOR.stats.stat5
    QUEUE: 1000
    R: ':STAT5:'
    XSIZE: 2048
    YSIZE: 2048

  - type: ADCore.NDStats
    HIST_SIZE: 256
    MAX_THREADS: 16
    NCHANS: 10000
    NDARRAY_PORT: ANDOR.rois.roi6
    P: BL21I-EA-DET-01
    PORT: ANDOR.stats.stat6
    QUEUE: 1000
    R: ':STAT6:'
    XSIZE: 2048
    YSIZE: 2048

  - type: ADCore.NDStdArrays
    R: ':ARR:'
    FTVL: USHORT
    NDARRAY_PORT: ANDOR.roi
    NELEMENTS: 4194304
    P: BL21I-EA-DET-01
    PORT: ANDOR.arr
    QUEUE: 2
    TYPE: Int16

  - type: ADCore.NDProcess
    ENABLED: 1
    NDARRAY_PORT: ANDOR.cam
    P: BL21I-EA-DET-01
    PORT: ANDOR.proc
    QUEUE: 1000
    R: ':PROC:'

  - type: ADCore.NDOverlay
    ENABLED: 1
    NDARRAY_PORT: ANDOR.proc
    P: BL21I-EA-DET-01
    PORT: ANDOR.over
    QUEUE: 1000
    R: ':OVER:'

  - type: ffmpegServer.ffmpegFile
    NDARRAY_PORT: ANDOR.cam
    P: BL21I-EA-DET-01
    PORT: ANDOR.fimg
    QUEUE: 1000
    R: ':FIMG:'

  - type: ADCore.NDFileTIFF
    ENABLED: 1
    NDARRAY_PORT: ANDOR.cam
    P: BL21I-EA-DET-01
    PORT: ANDOR.tiff
    QUEUE: 1000
    R: ':TIFF:'

  - type: ADCore.NDFileHDF5
    ENABLED: 1
    NDARRAY_PORT: ANDOR.cam
    P: BL21I-EA-DET-01
    PORT: ANDOR.hdf
    QUEUE: 1000
    R: ':HDF5:'

  - type: ffmpegServer.ffmpegStream
    P: BL21I-EA-DET-01
    R: ':MJPG:'
    PORT: ANDOR.mjpg
    NDARRAY_PORT: ANDOR.over
    QUEUE: 2
    HTTP_PORT: 8099

  - type: ADCore.NDPvxsPlugin
    ENABLED: 1
    NDARRAY_PORT: ANDOR.cam
    P: BL21I-EA-DET-01
    PORT: ANDOR.pva
    QUEUE: 1000
    R: ':PVA:'
    PVNAME: BL21I-EA-DET-01:PVA:ARRAY

  - type: epics.dbpf
    pv: BL21I-EA-DET-01:CAM:ShutterControl
    value: Open

  - type: epics.dbpf
    pv: BL21I-EA-DET-01:CAM:AcquireTime.PREC
    value: '6'

  - type: epics.StartupCommand
    command: callbackSetQueueSize(50000)
